# pdfce-gui — the rebuilt native desktop shell.
#
# This is THE ARTEFACT of the pdfceGUI project (PROJECT_PLAN.md §2). Its
# crate name and directory name are identical to the crate it replaces in
# `D:\Dev\pdfce\crates\pdfce-gui`, so fold-in (§7.3) is a directory swap
# and pdfce's root `Cargo.toml` needs no edit at all.
#
# ---------------------------------------------------------------------------
# STAGE S0 SCOPE
# ---------------------------------------------------------------------------
#
# Launch, open a PDF named on the command line, rasterize page 1 on a
# background thread, show it fit-to-page, zoom and pan. Nothing else — no
# ribbon, no dock, no panels, no tools, no file dialog. Every stage of this
# build produces a program that RUNS (PROJECT_PLAN.md §4); S0 is the
# smallest such program that exercises the three salvaged subsystems
# (`render/worker.rs`, `render/raster.rs`, `viewer/`) end to end against
# the live engine.
#
# `egui-shell` (the reusable shell crate, the other workspace member) is
# deliberately NOT a dependency at S0. It does not compile yet, and S0 is
# specified as standalone so the two can be built in parallel.

[package]
name = "pdfce-gui"
description = "pdfce native desktop shell (egui/eframe), rebuilt. S0 scope: open a PDF from argv, render page 1 off-thread, zoom and pan."
# `version` is NOT inherited: this workspace's `[workspace.package]` block
# (see the root `Cargo.toml`) carries only `edition`, `rust-version` and
# `license`, because the crate is versioned by the pdfce workspace it folds
# INTO, not by this staging workspace. At fold-in this line is deleted and
# `version.workspace = true` takes its place.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pdfce-gui"
path = "src/main.rs"

[features]
# ---------------------------------------------------------------------------
# FORWARDED STRIPPABLE CAPABILITIES
#
# Carried across from the old crate's manifest VERBATIM in intent, because
# the reason it exists is a live regression that lasted one commit: the
# feature block was missing, `pdfce-core` was taken with
# `default-features = false`, and the GUI silently lost JPEG 2000 decoding
# entirely. `cargo tree -p pdfce-gui -i hayro-jpeg2000` came back EMPTY.
# Nothing failed to compile; the shell simply stopped being able to decode
# a codec it had shipped with all along.
#
# That is the failure mode to remember: forgetting to forward does not
# break the build, it REMOVES A CAPABILITY, and only a dependency query or
# a real JPX document reveals it.
#
# The rule from `pdfce-core`'s own manifest, restated because it binds
# here: Cargo unifies features across the whole graph, so every
# intermediate crate must (a) take `pdfce-core` with
# `default-features = false` and (b) re-export each capability it forwards.
default = ["jpx", "ocrs"]
jpx = ["pdfce-core/jpx", "pdfce-render/jpx"]

# ---------------------------------------------------------------------------
# `ocrs` — the OCR RECOGNISER, and only the recogniser.
#
# ★ WHAT THIS FLAG ACTUALLY BUYS, because the split is easy to get backwards.
#
# `pdfce-core` gates a smaller thing than its name suggests. Its own manifest
# spells the boundary out:
#
#   NOT gated  `ocr::{RecognizedWord, OcrPage, OcrEngine, words_to_page_space}`
#              and the whole of `ocr::layer` — the types, the y-flip, and the
#              ISO 32000-1 §9.3.6 mode-3 "sandwich" writer. Pure PDF work with
#              no dependency, compiled unconditionally.
#   Gated      `ocr::engine_ocrs` — the recogniser, and nothing else.
#
# So this shell could *write* an invisible text layer from words obtained some
# other way with the flag off, and cannot *produce* those words. Since the
# only source of words pdfce has is `ocrs`, the flag is the difference between
# `tools.ocr` working and `tools.ocr` refusing by name.
#
# WHY IT IS IN `default`, which is a decision rather than a copy of the
# engine's: rule 1 of the engine's strippable-capability convention is that a
# build which omits nothing must behave as it did before the feature existed,
# and the corollary here is stronger — OCR is the reason most people reach for
# a PDF tool on scanned material, and a default build that silently could not
# do it would be a regression wearing a feature flag. The cost is compile time
# and binary size (the `rten` inference runtime), not runtime: the models are
# loaded from disk on demand and a build that never runs OCR never touches
# them.
#
# NO NEW LICENCE EXPOSURE FROM THE CODE. `ocrs` and the eleven-crate `rten`
# stack beneath it are MIT OR Apache-2.0, with Apache-2.0-only `flatbuffers`
# at the bottom — all permissive, verified against the resolved graph by
# `pdfce-core`'s own manifest, and every one of them already in
# `D:\Dev\pdfce`'s lockfile. So this does not add a dependency the workspace
# root's rule would call an operator decision; it adopts crates pdfce already
# ships. The MODEL WEIGHTS are the separate question, they are CC-BY-SA-4.0,
# and the operator answered it on 2026-08-14 — see `about.hbs`,
# `crates/pdfce-gui/src/text/about.rs` and `tools/package-portable.py`.
#
# NO NETWORK, structurally: `ocrs`'s model downloader lives in the separate
# `ocrs-cli` binary crate, not in the `ocrs` library, so nothing reachable
# from here can fetch anything.
#
# `pdfce-render` is deliberately NOT listed. It has no `ocrs` feature — OCR is
# entirely a core concern — and naming a feature a crate does not declare is a
# hard Cargo error rather than a silent no-op, which is the one direction of
# this mistake that is safe.
ocrs = ["pdfce-core/ocrs"]

[dependencies]
# eframe = egui's application shell. Version, backend and feature set are
# pinned once in this workspace's root `[workspace.dependencies]` to match
# `D:\Dev\pdfce` exactly (glow rather than wgpu — the wgpu 29 stack fails
# to compile on Windows; see the old crate's manifest and D:\dev\rag\rust
# for the full finding). Taking it `.workspace = true` is what makes the
# "no dependency this workspace adds that is not already in pdfce's
# lockfile" rule (PROJECT_PLAN.md §2, Version pinning) mechanically true
# rather than a promise.
eframe.workspace = true

# egui, as a DIRECT dependency.
#
# This is a deliberate divergence from the old crate, which reached egui
# only through `eframe`'s re-export and documented why: "so there is no way
# for the two to drift to incompatible versions in Cargo.lock". That
# reasoning was correct for a crate whose manifest named only `eframe`.
# Here the workspace root pins BOTH to `0.35` in one place, so drift is
# prevented by the pin rather than by indirection, and naming egui directly
# means the module tree can `use egui::…` without every file routing
# through `eframe::egui` — which matters once `egui-shell` (which depends
# on egui and NOT on eframe, because a reusable shell must not choose the
# host's windowing backend) is in the picture.
#
# If these two ever resolve to different `egui` packages, the build breaks
# loudly at the first `egui::Context` handed from eframe to our code. That
# is the failure mode we want: a type error, not a silent second copy.
egui.workspace = true

# ---------------------------------------------------------------------------
# PATH DEPENDENCIES INTO THE READ-ONLY ENGINE (PROJECT_PLAN.md §2)
# ---------------------------------------------------------------------------
#
# `../../../pdfce/…` resolves from `D:\Dev\pdfceGUI\crates\pdfce-gui\`:
#   crates/pdfce-gui -> crates -> pdfceGUI -> Dev, then down into
#   `pdfce/crates/…`. Verified to resolve, not assumed.
#
# These are paths rather than a vendored copy ON PURPOSE, and the
# consequence is the point: **this crate always builds against the live
# engine.** If `pdfce-core` changes under us we find out at compile time
# rather than at fold-in, months later, all at once. A vendored copy would
# hide divergence until the worst possible moment.
#
# `D:\Dev\pdfce` is READ-ONLY for this project (PROJECT_PLAN.md §6.1).
# Anything the engine needs to grow is a written hand-off to
# `pdfce-engineer` and lands there as its own Pass.
#
# `default-features = false` on both is MANDATORY, not tidiness — see the
# `[features]` block above. The `jpx` capability is re-enabled through this
# crate's own default feature, so a plain `cargo build` is byte-identical
# in capability to the old crate's.
# egui-shell — the reusable application shell (manifest, ribbon, theme,
# command registry). Added at S2. It knows nothing about PDF and must never
# learn: `tools/gates/check-shell-purity.sh` enforces that from the other
# side, and this dependency is deliberately one-directional.
egui-shell.workspace = true

# rfd: native file-open/save dialogs, no C dependency (docs/PRIOR_ART.md). MIT.
#
# The version is `D:\Dev\pdfce\crates\pdfce-gui\Cargo.toml`'s **exactly**, so
# this does not add a dependency to the project — it adopts one already in
# pdfce's lockfile and already licence-vetted. That is what the workspace
# root's rule asks for: a crate this workspace adds which is NOT already in
# pdfce's lockfile is an operator decision, and this one is not that.
#
# It replaces an interim Windows-only picker that shelled out to
# `powershell.exe`, written when this crate's manifest was not the file it
# was safe to edit. That shim worked and was verified live, but it was
# Windows-only, unparented to the pdfce window, and cost a process launch —
# and at fold-in it would have been deleted in favour of exactly this line.
rfd = "0.17.2"

# ★ PINNED to a commit, not a branch or a tag — 2026-08-14.
#
# These were relative paths (`../../../pdfce/...`) for the whole of
# development, which is right for editing both repos at once and wrong for
# publishing: source cloned from GitHub would not build for anyone who did
# not happen to have `pdfce` checked out as a sibling directory. The
# compiled binary was never affected — Rust links the engine statically, so
# a packaged build has always been self-contained.
#
# A COMMIT rather than a branch, deliberately: `main` moves, and a shell
# built against whatever the engine happened to be that morning is a build
# nobody can reproduce. Bumping this is then a deliberate act with a diff,
# which is what `HANDOFF.md` §11 assumes when it talks about filing against
# a specific engine revision.
#
# This pin was verified before it was written: local HEAD, `origin/main`
# and the source every binary in the 2026-08-14 session was compiled
# against were all exactly this commit, with a clean tree — so the exe
# attached to the release and the source a cloner gets are the same engine.
pdfce-core = { git = "https://github.com/KenM76/pdfce", rev = "718d1e9d4", default-features = false }
pdfce-render = { git = "https://github.com/KenM76/pdfce", rev = "718d1e9d4", default-features = false }

# pdfce-print — printer enumeration, device capabilities and spooling.
#
# No `default-features = false`, unlike its two siblings above, and the
# asymmetry is not an oversight: `pdfce-print` declares no features at all,
# so the flag would be a claim about a feature set that does not exist.
#
# Until this line existed the print dialog opened, said in one sentence that
# this build cannot spool, and **omitted the commit button rather than greying
# it** — the no-inert-controls rule. That sentence is deliberately distinct
# from "no printers found": `pdfce-print` is explicit that a build which
# cannot ask and a machine with nothing to ask about must never collapse into
# one message.
pdfce-print = { git = "https://github.com/KenM76/pdfce", rev = "718d1e9d4" }

[dev-dependencies]
# flate2 — used by ONE ignored test, `ocr::fixture::write_synthetic_image_only`,
# which generates `fixtures/synthetic-image-only.pdf`: a genuinely image-only
# PDF with no text layer, for verifying OCR end to end.
#
# WHY A DEPENDENCY AT ALL. That fixture is a page-sized raster, and a raster
# written with no filter is megabytes of zeroes and ink in a git repository.
# `/FlateDecode` takes it to tens of kilobytes. The alternatives were worse:
# `/ASCIIHexDecode` doubles the size, and hand-rolling DEFLATE to avoid a
# dev-dependency would be inventing a compressor to avoid using one.
#
# WHY IT COSTS NOTHING THIS PROJECT CARES ABOUT. It is a **dev**-dependency, so
# it is not in `pdfce-gui.exe`, `about.toml` sets `ignore-dev-dependencies` and
# `THIRD_PARTY_LICENSES.md` is generated from the SHIPPING graph — nothing about
# the notice or the packaging changes. The version, and the `rust_backend`
# feature that keeps it pure Rust, are `pdfce-core`'s own line copied exactly,
# so this adopts a crate already in pdfce's lockfile rather than adding one: the
# workspace root's rule is that a crate NOT already there is an operator
# decision, and this is not that.
#
# `default-features = false` is load-bearing for the same reason it is on
# `pdfce-core`'s copy: the C zlib backends would break the static-single-binary
# posture, and a dev-dependency that pulled a C toolchain into `cargo test`
# would make the suite unrunnable on a machine that can build the program.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
